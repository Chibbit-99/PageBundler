<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PageBundler</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <div class="brand"><span class="logo">P</span><div><h1>PageBundler</h1><p>Take this page with you.</p></div></div>
    <button id="save"><span class="button-icon">↓</span> Save page as ZIP</button>
    <div id="status" role="status" aria-live="polite">Ready to bundle the current tab.</div>
    <div id="details" hidden></div>
    <footer>Saved locally on your device</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
